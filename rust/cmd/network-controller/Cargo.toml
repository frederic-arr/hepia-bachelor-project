[package]
name = "network-controller"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bitflags = { workspace = true, features = ["std", "serde"] }
serde = { workspace = true, features = ["std", "derive"] }
sha3 = { workspace = true, features = ["alloc"] }
rustix = { workspace = true, features = [
    "std",
    "fs",
    "mm",
    "thread",
    "process",
] }
libc.workspace = true
system-controller.path = "../system-controller"
cos-proto-reconciler.path = "../../crates/cos-proto-reconciler"
cos-proto-reconciler-server.path = "../../crates/cos-proto-reconciler-server"
cos-proto-state.path = "../../crates/cos-proto-state"
cos-proto-state-client.path = "../../crates/cos-proto-state-client"
tokio = { workspace = true, features = ["macros", "rt", "process"] }
tonic = { workspace = true, features = ["transport", "router"] }
serde_json = { workspace = true, features = ["std"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["std", "fmt", "ansi"] }
derive_builder = { workspace = true, features = ["std"] }
rtnetlink = { workspace = true, features = ["tokio_socket"] }
futures.workspace = true
tokio-util.workspace = true
rand = { workspace = true, features = ["thread_rng"] }
smoltcp = { workspace = true, features = [
    "std",
    "socket-dhcpv4",
    "phy-raw_socket",
    "async",
] }
tokio-stream = { workspace = true, features = ["net"] }
ntpd = { workspace = true, features = ["aws-lc", "pps", "rustcrypto", "srv"] }

[dev-dependencies]
isolation.path = "../../crates/isolation"
tempfile.workspace = true
smol.workspace = true
