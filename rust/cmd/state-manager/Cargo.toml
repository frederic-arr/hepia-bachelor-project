[package]
name = "state-manager"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
cos-proto-reconciler.path = "../../crates/cos-proto-reconciler"
cos-proto-reconciler-client.path = "../../crates/cos-proto-reconciler-client"
cos-proto-state.path = "../../crates/cos-proto-state"
cos-proto-state-server.path = "../../crates/cos-proto-state-server"
cos-proto-api.path = "../../crates/cos-proto-api"
cos-proto-api-server.path = "../../crates/cos-proto-api-server"
network-controller.path = "../network-controller"
linux-utils.path = "../../crates/linux-utils"
tokio = { workspace = true, features = ["macros", "rt", "signal"] }
tokio-util.workspace = true
tonic = { workspace = true, features = ["channel"] }
serde_json = { workspace = true, features = ["std"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
] }
itertools = { workspace = true, features = ["use_std"] }
thiserror.workspace = true
argon2 = { workspace = true, features = ["alloc", "rand", "password-hash"] }
rustix = { workspace = true, features = ["mount", "fs", "system"] }
serde_yaml.workspace = true
