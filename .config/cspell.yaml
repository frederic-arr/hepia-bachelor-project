---
version: "0.2"
useGitignore: true
languageSettings:
  - languageId: "*"
    locale: fr
    allowCompoundWords: true
    words:
      - clusterisés
      - déclarativité
      - multinœuds
      - bénéfiques
      - impératives
      - contrôleur
      - péjorer
      - débuggage
      - débuggages
      - débugger
      - replanification
      - requêter
      - replanifiée
      - replanifier
      - replanifie
      - redéclencher
      - Ryzen
      - TOCTOU
      - flushée
      - rtnetlink
      - Limine
      - recalcul
      - typstfmt
      - désérialisation
      - Sidero
      - LUKS
      - asynchronicité
      - nixpkgs
      - netavark
      - glspl
      - VirtIO
      - aujourd
      - persistés
  - languageId: typst
    ignoreRegExpList:
      - string
      - /@[a-zA-Z0-9_-]+/g
      - /\<[a-zA-Z0-9_-]+\>/g
    words:
      - rustc
      - typst
      - cntr
      - Alegreya
      - pagebreak
      - emph
      - codly
      - linguify
      - glossarium
      - touying
      - refdiagram
      - sbref
      - dhcpd
      - resolv
      - smoltcp
      - hviolin
      - xaxis
      - yaxis
      - xlabel
      - ylabel
      - lilaq
      - hyph
      - nixos
      - mkcell
      - hline
      - networkd
      - clippy
      - Serde
      - rootfs
      - Tmpfs
overrides:
  - filename: "docs/**/*.typ"
    languageId: typst
    language: en,fr
  - filename: "docs/internal/**/*.md"
    language: en,fr
ignorePaths:
  - docs/internal/lib
  - docs/internal/notes
  - docs/internal/project
  - docs/internal/thesis/scratchpad.typ
files:
  - README.md
  - docs/**/*.typ
  - docs/**/*.md
words:
  - Gradechelor
  - Frédéric
  - Arroyo
  - Florent
  - Glück
  - HEPIA
  - Swapneel
  - MEHTA
  - Codeberg
  - declarativity
