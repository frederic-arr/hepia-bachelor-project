---
schema: install
disks:
  - dev: /dev/vda
    partitions:
      - type: boot
      - type: config
      - type: data

---
schema: api
auth: none

---
schema: network:dns
nameservers:
  - 9.9.9.9

---
schema: network:link
name: eth0
admin_up: true

---
schema: network:dhcp
name: eth0

---
schema: container:runtime
name: rootless
engine: podman
uid: 1000
gid: 1000
depends_on:
  - network:dns
  - network:route/eth0-dhcp

---
schema: container:instance
name: demo
image: docker.io/library/nginx:latest
runtime: rootless
ports:
  - container_port: 8080
    host_port: 8080
