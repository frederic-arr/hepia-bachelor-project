workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - check
  - test
  - build
  - e2e

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-cache"
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always

check-docs-internal:
  stage: check
  script: nix develop -c just docs check

build-docs-internal:
  stage: build
  script:
    - nix develop -c just docs build
    - cp -r docs/internal/output/ ./output/
  artifacts:
    when: on_success
    access: all
    name: documents
    expire_in: 7 days
    paths: [output/**/*.pdf]
  needs: [check-docs-internal]

check-proto:
  stage: check
  script: nix develop -c just proto check

check-rust:
  stage: check
  script: nix develop -c just rust check

test-rust-doc:
  stage: test
  script: nix develop -c just rust test-doc
  needs: [check-rust]

test-rust-unit:
  stage: test
  script: nix develop -c just rust test-unit
  needs: [check-rust]
  artifacts:
    when: always
    reports:
      junit: rust/target/nextest/default/junit.xml

test-rust-integration:
  stage: test
  script: nix develop -c just rust test-integration
  needs: [check-proto, test-rust-unit]
  artifacts:
    when: always
    reports:
      junit: rust/target/nextest/default/junit.xml

build-iso:
  stage: build
  script:
    - nix build -L .#iso
    - cp -L result ./output/container.iso
  artifacts:
    when: on_success
    access: all
    name: ISO
    expire_in: 7 days
    paths: [output/*.iso]
  needs: [test-rust-integration]

e2e-rust:
  stage: e2e
  script: nix build -L .#checks.x86_64-linux.e2e
  needs: [build-iso]
  artifacts:
    when: always
    reports:
      junit: result/junit.xml

