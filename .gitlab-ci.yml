stages:
  - lint
  - build

lint-docs-internal:
  stage: lint
  script: just docs::lint
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - when: manual

build-docs-internal:
  stage: build
  script:
    - just docs::compile
    - mkdir -p output/slides/
    - cp docs/internal/slides/out/*.pdf output/slides/
    - cp docs/internal/subject-statement/*.pdf output/
    - cp docs/internal/abstract/*.pdf output/
    - cp docs/internal/poster/*.pdf output/
    - cp docs/internal/thesis/*.pdf output/
  artifacts:
    when: on_success
    access: all
    name: documents
    expire_in: 7 days
    paths: [output/**/*.pdf]
  needs: [lint-docs-internal]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - when: manual
