workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - check
  - build

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-cache"
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always

check-docs-internal:
  stage: check
  script: nix develop -c just docs check

build-docs-internal:
  stage: build
  script:
    - nix develop -c just docs build
    - cp -r docs/internal/output/ ./output/
  artifacts:
    when: on_success
    access: all
    name: documents
    expire_in: 7 days
    paths: [output/**/*.pdf]
  needs: [check-docs-internal]

check-proto:
  stage: check
  script: nix develop -c just proto check

check-rust:
  stage: check
  script: nix develop -c just rust check
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo-cache/registry
      - .cargo-cache/git
      - target/

