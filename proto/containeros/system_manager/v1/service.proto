syntax = "proto3";

package containeros.system_manager.v1;

import "containeros/shared/v1/shared.proto";

service SystemManagerService {
  rpc ResourceCreateDynamic(ResourceCreateDynamicRequest) returns (ResourceCreateDynamicResponse) {}
  rpc ResourceList(ResourceListRequest) returns (ResourceListResponse) {}
  rpc ResourceRead(ResourceReadRequest) returns (ResourceReadResponse) {}
  rpc ResourceUpdateDynamicSpec(ResourceUpdateDynamicSpecRequest) returns (ResourceUpdateDynamicSpecResponse) {}
  rpc ResourceUpdateState(ResourceUpdateStateRequest) returns (ResourceUpdateStateResponse) {}
  rpc ResourceDeleteDynamic(ResourceDeleteDynamicRequest) returns (ResourceDeleteDynamicResponse) {}
}

message ResourceCreateDynamicRequest {
  containeros.shared.v1.Identity id = 1;
  containeros.shared.v1.Identity owner = 2;
  bytes spec = 3;
}

message ResourceCreateDynamicResponse {}

message ResourceListRequest {
  string schema = 1;
}

message ResourceListResponse {
  repeated containeros.shared.v1.MetaResource resource = 1;
}

message ResourceReadRequest {
  containeros.shared.v1.Identity id = 1;
}

message ResourceReadResponse {
  containeros.shared.v1.MetaResource resource = 1;
}

message ResourceUpdateDynamicSpecRequest {
  containeros.shared.v1.Identity id = 1;
  bytes spec = 2;
}

message ResourceUpdateDynamicSpecResponse {}

message ResourceUpdateStateRequest {
  containeros.shared.v1.Identity id = 1;
  bytes state = 2;
}

message ResourceUpdateStateResponse {}

message ResourceDeleteDynamicRequest {
  containeros.shared.v1.Identity id = 1;
}

message ResourceDeleteDynamicResponse {}
